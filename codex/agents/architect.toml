# coding-agent-environment:managed-routing-role:v1
name = "architect"
description = "High-capability architect for unresolved architecture, cross-repository contracts, ambiguous requirements, security/trust, concurrency, persistence/migrations, difficult root causes, host contradictions, and irreversible/public compatibility decisions. Return a bounded contract before implementation."
