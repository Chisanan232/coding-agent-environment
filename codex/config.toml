# Portable Codex CLI/desktop configuration.
#
# This is a curated SUBSET of ~/.codex/config.toml — only the durable,
# user-chosen preferences. Excluded on purpose (never copy these wholesale):
#   - [projects."<path>"] trust entries       — machine-specific, regenerate by using Codex per-repo
#   - notify                                  — points at a local .app bundle path
#   - [mcp_servers.node_repl]                 — Codex.app-bundled internal tooling, not user config
#   - [marketplaces.*]                        — Codex-managed local resolution cache
#   - [[hooks.*]] / [hooks.state.*]           — generated by codebase-memory-mcp's own installer
#   - [apps.connector_*.*]                    — generated OAuth/connector tool-approval state
#
# Install: copy the sections below into ~/.codex/config.toml, or merge by hand
# if you already have machine-specific [projects.*]/[mcp_servers.*] entries.

model = "gpt-5.6-luna"
model_reasoning_effort = "medium"

[features]
js_repl = false

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
keepRemoteControlAwakeWhilePluggedIn = true

# ---------------------------------------------------------------------------
# Status line / terminal title — see SPE-72 for the field-by-field rationale.
# ---------------------------------------------------------------------------
[tui]
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit", "used-tokens", "git-branch", "current-dir", "project-name", "thread-title", "task-progress"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "current-dir", "run-state", "thread-title", "git-branch", "model-with-reasoning", "task-progress"]

# ---------------------------------------------------------------------------
# Plugin enablement — mirrors Claude Code's enabledPlugins model.
# ---------------------------------------------------------------------------
[plugins."build-ios-apps@openai-curated"]
enabled = true

[plugins."build-macos-apps@openai-curated"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."figma@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."atlassian-rovo@openai-curated"]
enabled = true

# ---------------------------------------------------------------------------
# MCP servers — secrets by reference only, same boundary as .mcp.json.
# ---------------------------------------------------------------------------
[mcp_servers.figma-developer-mcp]
command = "npx"
args = ["-y", "figma-developer-mcp", "--stdio"]

[mcp_servers.figma-developer-mcp.env]
FIGMA_API_KEY = "${FIGMA_API_KEY}"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"

[mcp_servers.github.tools.create_pull_request]
approval_mode = "approve"

[mcp_servers.github.tools.add_issue_comment]
approval_mode = "approve"

[mcp_servers.github.tools.update_pull_request]
approval_mode = "approve"

[mcp_servers.github.tools.pull_request_review_write]
approval_mode = "approve"

[mcp_servers.github.tools.merge_pull_request]
approval_mode = "approve"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.codebase-memory-mcp]
# PATH lookup, not a hardcoded install path — see SPE-70 audit (same fix
# applied to Claude Code's cbm-code-discovery-gate hook).
command = "codebase-memory-mcp"
