name: Capability profile validation
on:
  # No path filter on pull_request: isolated-validation and native-resource-wire are required status checks, and a
  # required check that never runs on a PR leaves it waiting forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.claude/CLAUDE.md'
      - '.claude/settings.json'
      - '.claude/skills/**'
      - '.claude/hooks/**'
      - 'codex/**'
      - 'scripts/profile-install.sh'
      - 'scripts/sync-check.sh'
      - 'scripts/storage-integration.py'
      - 'scripts/build-baseline.py'
      - 'docs/ENGINEERING-BASELINE.md'
      - 'scripts/qa-identity-setup.py'
      - 'scripts/qa-side.py'
      - 'scripts/qa-hop-install.py'
      - 'scripts/resource-policy-install.py'
      - 'scripts/launcher-install.py'
      - 'scripts/hook-rollout.py'
      - 'scripts/owner-merge-gate.py'
      - 'docs/ENGINEERING-CONSTITUTION.md'
      - 'tests/test-engineering-constitution.py'
      - 'scripts/constitution-behavior-matrix.py'
      - 'tests/test-constitution-behavior-matrix.py'
      - 'scripts/owner-merge-runner.py'
      - 'scripts/owner-merge-evidence-sign.py'
      - 'scripts/branch-protection-rollout.py'
      - 'docs/OWNER-MERGE-AUTONOMY.md'
      - 'tests/test-owner-merge-autonomy.py'
      - 'tests/test-owner-merge-runner.py'
      - 'tests/test-branch-protection-rollout.py'
      - 'docs/permission-corpus/owner-merge-corpus.json'
      - 'docs/examples/owner-merge-pinned-allow.example.json'
      - 'scripts/workstation-policy.py'
      - 'scripts/candidate-rollout.py'
      - 'tests/test-rtk-proxy-prompt-removal.py'
      - 'tests/test-permission-host-matrix.py'
      - 'scripts/permission-host-matrix.py'
      - 'docs/permission-corpus/routine-command-corpus.json'
      - 'docs/ROLLOUT-RTK-PROXY-SCOPING.md'
      - 'scripts/workstation-policy-hook.py'
      - 'scripts/memory-admission.py'
      - 'scripts/session-notify.py'
      - 'tests/test-session-notify.py'
      - 'docs/SESSION-NOTIFICATIONS.md'
      - 'docs/examples/session-notify*.json'
      - 'scripts/mcp-scope-inspect.py'
      - 'scripts/campaign-resume.py'
      - 'scripts/spe108-live/**'
      - 'scripts/parity-dogfood.py'
      - 'scripts/codex-routing.py'
      - 'scripts/verify-codex-routing.py'
      - 'scripts/visual-skills.py'
      - 'docs/UI-UX-POLICY.md'
      - 'docs/templates/**'
      - 'tests/**'
      - 'bin/**'
      - '.github/workflows/capability-validation.yml'
permissions:
  contents: read
jobs:
  isolated-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate isolated capability and existing profile boundaries
        run: |
          bash -n scripts/profile-install.sh scripts/sync-check.sh
          bash tests/test-capability-profile.sh
          bash tests/test-profile-resolver.sh
          python3 tests/test-signal-density.py
          python3 tests/test-engineering-workflow.py
          python3 tests/test-claude-md-invariants.py
          python3 tests/test-claude-clause-drift.py
          python3 tests/test-closeout.py
          python3 tests/test-ticket-state.py
          python3 tests/test-context-state.py
          python3 tests/test-context-install.py
          python3 tests/test-full-parity-inventory.py
          python3 tests/test-full-parity-install.py
          python3 tests/test-codex-routing.py
          python3 tests/test-visual-skills.py
          python3 tests/test-ui-ux-policy.py
          python3 tests/test-storage-integration.py
          python3 tests/test-statusline-composition.py
          python3 tests/test-statusline-install.py
          python3 tests/test-profile-statusline.py
          python3 tests/test-permission-governance.py
          python3 tests/test-permission-rollout.py
          python3 tests/test-decision-delegation.py
          python3 tests/test-campaign-completion.py
          python3 tests/test-baseline-behavior-map.py
          python3 tests/test-adoption-probe.py
          python3 tests/test-resource-adapters.py
          python3 tests/test-native-resource-adapters.py
          python3 tests/test-resource-policy-install.py
          python3 tests/test-launcher-runtime.py
          python3 tests/test-campaign-resume.py
          python3 tests/test-disk-admission-gate.py
          python3 tests/test-admission-queue.py
          python3 tests/test-disk-admission.py
          python3 tests/test-admission-measurements.py
          python3 tests/test-workload-classes.py
          python3 tests/test-shadow-budget.py
          python3 tests/test-reservation-veto.py
          python3 tests/test-banded-job-caps.py
          python3 tests/test-hook-rollout.py
          python3 tests/test-owner-merge-gate.py
          python3 tests/test-owner-merge-gate-local.py
          python3 tests/test-engineering-constitution.py
          python3 tests/test-constitution-behavior-matrix.py
          python3 tests/test-owner-merge-autonomy.py
          python3 tests/test-owner-merge-runner.py
          python3 tests/test-branch-protection-rollout.py
          python3 tests/test-routing-eval.py
          python3 tests/test-model-routing-doc.py
          python3 tests/test-pr-merge-policy.py
          python3 tests/test-merge-decision.py
          python3 tests/test-ask-first-apply.py
          python3 tests/test-trusted-allow.py
          python3 tests/test-canonical-executor.py
          python3 tests/test-workstation-policy.py
          python3 tests/test-candidate-rollout.py
          python3 tests/test-rtk-proxy-prompt-removal.py
          python3 tests/test-permission-host-matrix.py
          python3 tests/test-workstation-policy-hook.py
          python3 tests/test-memory-admission.py
          python3 tests/test-session-notify.py
          python3 tests/test-mcp-scope-inspect.py
          python3 tests/test-spe108-live.py
          python3 tests/test-adoption-coverage.py
          python3 tests/test-build-baseline.py
          python3 tests/test-resource-lifecycle.py
          python3 tests/test-qa-handoff.py
          python3 tests/test-qa-identity-setup.py
          python3 tests/test-qa-side.py
          python3 tests/test-qa-handoff-unattended.py
          python3 tests/test-qa-hop-install.py
          python3 tests/test-parity-dogfood.py
  native-resource-wire:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read pinned shared engine revision
        id: pin
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          pin = json.load(open('codex/storage-core.json'))
          assert pin['repository'] == 'https://github.com/Chisanan232/glomeris'
          assert re.fullmatch('[0-9a-f]{40}', pin['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('revision=' + pin['revision'] + '\n')
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: Chisanan232/glomeris
          ref: ${{ steps.pin.outputs.revision }}
          path: native-core
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact pinned core and validate native wire
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          cargo build --locked --manifest-path native-core/Cargo.toml --bin glomeris --target-dir "$RUNNER_TEMP/core-target"
          GLOMERIS_NATIVE_WIRE_BINARY="$RUNNER_TEMP/core-target/debug/glomeris" python3 tests/test-resource-native-wire.py
