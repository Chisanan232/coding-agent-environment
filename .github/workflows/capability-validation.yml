name: Capability profile validation
on:
  pull_request:
    paths:
      - '.claude/CLAUDE.md'
      - '.claude/settings.json'
      - '.claude/skills/**'
      - '.claude/hooks/**'
      - 'codex/**'
      - 'scripts/profile-install.sh'
      - 'scripts/sync-check.sh'
      - 'scripts/storage-integration.py'
      - 'scripts/resource-policy-install.py'
      - 'scripts/launcher-install.py'
      - 'scripts/parity-dogfood.py'
      - 'scripts/codex-routing.py'
      - 'scripts/verify-codex-routing.py'
      - 'tests/**'
      - 'bin/**'
      - '.github/workflows/capability-validation.yml'
  push:
    branches: [main]
    paths:
      - '.claude/CLAUDE.md'
      - '.claude/settings.json'
      - '.claude/skills/**'
      - '.claude/hooks/**'
      - 'codex/**'
      - 'scripts/profile-install.sh'
      - 'scripts/sync-check.sh'
      - 'scripts/storage-integration.py'
      - 'scripts/resource-policy-install.py'
      - 'scripts/launcher-install.py'
      - 'scripts/parity-dogfood.py'
      - 'scripts/codex-routing.py'
      - 'scripts/verify-codex-routing.py'
      - 'tests/**'
      - 'bin/**'
      - '.github/workflows/capability-validation.yml'
permissions:
  contents: read
jobs:
  isolated-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate isolated capability and existing profile boundaries
        run: |
          bash -n scripts/profile-install.sh scripts/sync-check.sh
          bash tests/test-capability-profile.sh
          bash tests/test-profile-resolver.sh
          python3 tests/test-signal-density.py
          python3 tests/test-engineering-workflow.py
          python3 tests/test-closeout.py
          python3 tests/test-ticket-state.py
          python3 tests/test-full-parity-inventory.py
          python3 tests/test-full-parity-install.py
          python3 tests/test-codex-routing.py
          python3 tests/test-storage-integration.py
          python3 tests/test-statusline-composition.py
          python3 tests/test-statusline-install.py
          python3 tests/test-profile-statusline.py
          python3 tests/test-permission-governance.py
          python3 tests/test-resource-adapters.py
          python3 tests/test-native-resource-adapters.py
          python3 tests/test-resource-policy-install.py
          python3 tests/test-launcher-runtime.py
          python3 tests/test-parity-dogfood.py
  native-resource-wire:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read pinned shared engine revision
        id: pin
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          pin = json.load(open('codex/storage-core.json'))
          assert pin['repository'] == 'https://github.com/Chisanan232/glomeris'
          assert re.fullmatch('[0-9a-f]{40}', pin['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('revision=' + pin['revision'] + '\n')
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: Chisanan232/glomeris
          ref: ${{ steps.pin.outputs.revision }}
          path: native-core
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact pinned core and validate native wire
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          cargo build --locked --manifest-path native-core/Cargo.toml --bin glomeris --target-dir "$RUNNER_TEMP/core-target"
          GLOMERIS_NATIVE_WIRE_BINARY="$RUNNER_TEMP/core-target/debug/glomeris" python3 tests/test-resource-native-wire.py
